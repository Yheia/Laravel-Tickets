
services:
  app:
    build: .
    container_name: tickets_app
    # restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    entrypoint: ["./build_up.sh"]
    command: php-fpm

  nginx:
    image: nginx:latest
    container_name: tickets_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - ./:/var/www
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: tickets_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickets
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: tickets
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tickets_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  dbdata:

